<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包云盘 - 隧道导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #3370ff 0%, #5b8def 100%);
            color: white;
            padding: 30px 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .update-time {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 8px;
        }
        .content {
            padding: 24px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .refresh-btn {
            flex: 1;
            padding: 14px;
            background: #f5f7fa;
            border: none;
            border-radius: 10px;
            color: #3370ff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .refresh-btn:hover {
            background: #e8f0ff;
        }
        .refresh-btn:active {
            transform: scale(0.98);
        }
        .refresh-btn svg {
            width: 18px;
            height: 18px;
        }
        .refresh-btn.loading svg {
            animation: spin 1s linear infinite;
        }
        .speedtest-btn {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .speedtest-btn:hover {
            opacity: 0.9;
        }
        .speedtest-btn:active {
            transform: scale(0.98);
        }
        .speedtest-btn svg {
            width: 18px;
            height: 18px;
        }
        .speedtest-btn.testing svg {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .tunnel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .tunnel-item {
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }
        .tunnel-item:hover {
            border-color: #3370ff;
            background: #f8faff;
        }
        .tunnel-item.online {
            border-color: #10b981;
            background: #f0fdf4;
        }
        .tunnel-item.best {
            border-color: #f59e0b;
            background: #fffbeb;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }
        .tunnel-item.best::before {
            content: '⚡ 最快';
            position: absolute;
            top: -10px;
            right: 16px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 10px;
        }
        .tunnel-item.offline {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .tunnel-item.offline:hover {
            border-color: #e8ecf1;
            background: white;
        }
        .tunnel-item.checking {
            border-color: #fbbf24;
            background: #fffbeb;
        }
        .tunnel-item.testing {
            border-color: #8b5cf6;
            background: #faf5ff;
        }
        .tunnel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .tunnel-name {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.checking {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.testing {
            background: #ede9fe;
            color: #7c3aed;
        }
        .status-badge.online {
            background: #d1fae5;
            color: #059669;
        }
        .status-badge.offline {
            background: #fee2e2;
            color: #dc2626;
        }
        .tunnel-url {
            font-size: 12px;
            color: #6b7280;
            word-break: break-all;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            background: #f9fafb;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .tunnel-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tunnel-hint {
            font-size: 12px;
            color: #9ca3af;
        }
        .tunnel-item.online .tunnel-hint {
            color: #10b981;
        }
        .tunnel-speed {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
        }
        .tunnel-item.online .tunnel-speed {
            color: #059669;
        }
        .tunnel-item.best .tunnel-speed {
            color: #d97706;
            font-size: 14px;
        }
        .speed-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .speed-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            border-radius: 2px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .tunnel-item.best .speed-bar-fill {
            background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
        }
        .loading, .error {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }
        .loading .icon {
            font-size: 36px;
            margin-bottom: 10px;
            animation: bounce 1s infinite;
        }
        .error .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .divider {
            height: 1px;
            background: #f3f4f6;
            margin: 20px 0;
        }
        .tips {
            background: #fefce8;
            border-radius: 10px;
            padding: 14px;
            font-size: 13px;
            color: #854d0e;
            line-height: 1.7;
        }
        .tips-title {
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer {
            text-align: center;
            padding: 16px 24px;
            background: #f9fafb;
            font-size: 12px;
            color: #9ca3af;
        }
        .auto-refresh {
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
            margin-top: 8px;
        }
        .speed-progress {
            font-size: 11px;
            color: #8b5cf6;
            margin-top: 4px;
        }
        @media (max-width: 480px) {
            .header {
                padding: 24px 20px;
            }
            .header h1 {
                font-size: 20px;
            }
            .content {
                padding: 20px;
            }
            .tunnel-item {
                padding: 14px;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☁️ 豆包云盘</h1>
            <p>隧道导航 - 智能测速，最优线路优先</p>
            <div class="update-time" id="updateTime">数据加载中...</div>
        </div>
        <div class="content">
            <div class="btn-group">
                <button class="refresh-btn" onclick="loadTunnels()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                    <span>刷新并出新线路</span>
                </button>
                <button class="speedtest-btn" onclick="runSpeedTest()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    <span>测速排序</span>
                </button>
            </div>
            <div class="auto-refresh">点击「刷新并出新线路」自动启动新隧道 · 测速后自动按速度排序</div>
            
            <div class="tunnel-list" id="tunnelList">
                <div class="loading">
                    <div class="icon">🔄</div>
                    <div>正在加载隧道列表...</div>
                </div>
            </div>
            
            <div class="divider"></div>
            <div class="tips">
                <div class="tips-title">
                    <span>💡</span>
                    <span>使用说明</span>
                </div>
                <div>
                    • 点击「刷新并出新线路」自动启动一条新隧道<br>
                    • 点击「测速排序」自动测试每条线路速度<br>
                    • 最快的线路会标记 ⚡ 并排在最前面<br>
                    • 服务器每10分钟自动补充新线路
                </div>
            </div>
            
            <div class="divider"></div>
            
            <div class="tips" style="background: #ecfdf5; color: #065f46;">
                <div class="tips-title">
                    <span>🔄</span>
                    <span>线路都离线了怎么办？</span>
                </div>
                <div>
                    不用担心！点击「刷新并出新线路」即可：<br>
                    • 自动启动一条新隧道<br>
                    • 30秒后自动刷新显示新线路<br>
                    • 服务器每10分钟也会自动补充新线路<br>
                    • 最多等10分钟就一定有新的可用
                </div>
            </div>
        </div>
        <div class="footer">
            豆包云盘 · 极简存储 · 智能测速导航
        </div>
    </div>
    <script>
        // 配置 - 使用相对路径加载数据，和页面同域名，兼容性更好
        const DATA_FILE = 'tunnels.json';
        const SPEED_TEST_SIZE = 100; // 测速文件大小，单位 KB
        
        // 状态
        let tunnels = [];
        let lastUpdate = null;
        let isSpeedTesting = false;
        let speedTestResults = {}; // 存储测速结果
        
        // 格式化速度
        function formatSpeed(kbps) {
            if (kbps < 1024) {
                return `${kbps.toFixed(1)} KB/s`;
            } else {
                return `${(kbps / 1024).toFixed(2)} MB/s`;
            }
        }
        
        // 显示Toast提示
        function showToast(message, duration = 3000) {
            // 检查是否已存在toast
            let toast = document.getElementById('toast-message');
            if (toast) {
                toast.remove();
            }
            
            toast = document.createElement('div');
            toast.id = 'toast-message';
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 9999;
                animation: toastIn 0.3s ease;
            `;
            toast.textContent = message;
            
            // 添加动画样式
            if (!document.getElementById('toast-style')) {
                const style = document.createElement('style');
                style.id = 'toast-style';
                style.textContent = `
                    @keyframes toastIn {
                        from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                        to { opacity: 1; transform: translateX(-50%) translateY(0); }
                    }
                    @keyframes toastOut {
                        from { opacity: 1; transform: translateX(-50%) translateY(0); }
                        to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                    }
                `;
                document.head.appendChild(style);
            }
            
            document.body.appendChild(toast);
            
            // 自动消失
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
        
        // 加载隧道数据
        async function loadTunnels(autoStart = true) {
            const btn = document.querySelector('.refresh-btn');
            const list = document.getElementById('tunnelList');
            const timeEl = document.getElementById('updateTime');
            
            btn.classList.add('loading');
            btn.querySelector('span').textContent = '加载中...';
            
            try {
                // 使用相对路径加载，和页面同域名，兼容性更好
                const timestamp = Date.now();
                const url = `${DATA_FILE}?t=${timestamp}`;
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('加载失败');
                }
                
                const data = await response.json();
                tunnels = data.tunnels || [];
                lastUpdate = data.updated_at || null;
                
                // 反转顺序，最新的排前面；重新命名为线路1、线路2...
                tunnels = tunnels.reverse().map((tunnel, index) => ({
                    ...tunnel,
                    name: `线路${index + 1}`,
                    status: 'unknown',
                    speed: null
                }));
                
                // 清空之前的测速结果
                speedTestResults = {};
                
                // 更新时间
                if (lastUpdate) {
                    const date = new Date(lastUpdate);
                    timeEl.textContent = `最后更新: ${date.toLocaleString('zh-CN')}`;
                }
                
                // 渲染列表
                renderTunnels();
                
                // 开始检测状态
                checkAllTunnels();
                
                // 自动启动新隧道（后台执行）
                if (autoStart && tunnels.length > 0) {
                    setTimeout(() => {
                        startNewTunnel().then(success => {
                            if (success) {
                                showToast('🚀 新线路启动中，30秒后刷新可见');
                                // 35秒后自动刷新一次，让用户看到新线路
                                setTimeout(() => {
                                    loadTunnels(false); // false表示不再启动新隧道，避免循环
                                }, 35000);
                            }
                        });
                    }, 1000);
                }
                
            } catch (error) {
                list.innerHTML = `
                    <div class="error">
                        <div class="icon">❌</div>
                        <div>加载失败，请稍后重试</div>
                        <div style="font-size: 12px; margin-top: 8px;">${error.message}</div>
                    </div>
                `;
            }
            
            btn.classList.remove('loading');
            btn.querySelector('span').textContent = '刷新并出新线路';
        }
        
        // 渲染隧道列表
        function renderTunnels() {
            const list = document.getElementById('tunnelList');
            
            if (tunnels.length === 0) {
                list.innerHTML = `
                    <div class="error">
                        <div class="icon">🔌</div>
                        <div>暂无可用隧道</div>
                        <div style="font-size: 12px; margin-top: 8px;">请稍后刷新查看</div>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = '';
            
            tunnels.forEach((tunnel, index) => {
                const item = document.createElement('div');
                item.className = 'tunnel-item checking';
                item.id = 'tunnel-' + index;
                item.innerHTML = `
                    <div class="tunnel-header">
                        <span class="tunnel-name">${tunnel.name}</span>
                        <span class="status-badge checking">检测中...</span>
                    </div>
                    <div class="tunnel-url">${tunnel.url}</div>
                    <div class="tunnel-info">
                        <span class="tunnel-hint">正在检测可用性...</span>
                        <span class="tunnel-speed"></span>
                    </div>
                    <div class="speed-bar">
                        <div class="speed-bar-fill" style="width: 0%"></div>
                    </div>
                `;
                list.appendChild(item);
            });
        }
        
        // 检测单个隧道
        async function checkTunnel(index) {
            const tunnel = tunnels[index];
            const item = document.getElementById('tunnel-' + index);
            if (!item) return;
            
            const badge = item.querySelector('.status-badge');
            const hint = item.querySelector('.tunnel-hint');
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const response = await fetch(tunnel.url + '/api/health', {
                    method: 'GET',
                    signal: controller.signal,
                    mode: 'no-cors'
                });
                
                clearTimeout(timeoutId);
                
                // no-cors模式下无法读取响应内容，只要不报错就认为在线
                tunnel.status = 'online';
                item.className = 'tunnel-item online';
                badge.className = 'status-badge online';
                badge.textContent = '✓ 在线';
                hint.textContent = '点击进入云盘';
                item.onclick = () => window.open(tunnel.url, '_blank');
                
            } catch (error) {
                tunnel.status = 'offline';
                item.className = 'tunnel-item offline';
                badge.className = 'status-badge offline';
                badge.textContent = '✗ 离线';
                hint.textContent = '线路已失效';
                item.onclick = null;
            }
        }
        
        // 启动新隧道
        async function startNewTunnel() {
            // 找一条在线的隧道来调用API
            const onlineTunnel = tunnels.find(t => t.status === 'online');
            if (!onlineTunnel) {
                // 如果没有检测到在线的，就用第一条试试
                if (tunnels.length > 0) {
                    return await startNewTunnelFromUrl(tunnels[0].url);
                }
                return false;
            }
            return await startNewTunnelFromUrl(onlineTunnel.url);
        }
        
        async function startNewTunnelFromUrl(baseUrl) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);
                
                const response = await fetch(baseUrl + '/api/tunnels/start', {
                    method: 'POST',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        console.log('新隧道启动成功:', data.data);
                        return true;
                    }
                }
                return false;
            } catch (error) {
                console.log('启动新隧道失败:', error);
                return false;
            }
        }
        
        // 检测所有隧道
        function checkAllTunnels() {
            tunnels.forEach((_, index) => {
                setTimeout(() => checkTunnel(index), index * 200);
            });
        }
        
        // 测试单个隧道速度
        async function testTunnelSpeed(index) {
            const tunnel = tunnels[index];
            const item = document.getElementById('tunnel-' + index);
            if (!item || tunnel.status !== 'online') return;
            
            const badge = item.querySelector('.status-badge');
            const speedEl = item.querySelector('.tunnel-speed');
            const hint = item.querySelector('.tunnel-hint');
            const barFill = item.querySelector('.speed-bar-fill');
            
            // 切换到测速状态
            item.classList.add('testing');
            item.classList.remove('online');
            badge.className = 'status-badge testing';
            badge.textContent = '测速中...';
            hint.textContent = '正在测试下载速度...';
            speedEl.textContent = '';
            
            try {
                const startTime = performance.now();
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                
                const response = await fetch(tunnel.url + '/api/speedtest?size=' + SPEED_TEST_SIZE, {
                    method: 'GET',
                    signal: controller.signal
                });
                
                if (!response.ok) {
                    throw new Error('测速失败');
                }
                
                // 读取完整数据
                const blob = await response.blob();
                const endTime = performance.now();
                
                clearTimeout(timeoutId);
                
                // 计算速度 (KB/s)
                const duration = (endTime - startTime) / 1000; // 秒
                const sizeKB = blob.size / 1024; // KB
                const speedKbps = sizeKB / duration;
                
                // 保存结果
                tunnel.speed = speedKbps;
                speedTestResults[tunnel.url] = speedKbps;
                
                // 更新显示
                item.classList.remove('testing');
                item.classList.add('online');
                badge.className = 'status-badge online';
                badge.textContent = '✓ 在线';
                hint.textContent = '点击进入云盘';
                speedEl.textContent = formatSpeed(speedKbps);
                
                // 更新速度条
                const maxSpeed = 200; // 假设最大200KB/s
                const percent = Math.min((speedKbps / maxSpeed) * 100, 100);
                barFill.style.width = percent + '%';
                
                return speedKbps;
                
            } catch (error) {
                // 测速失败，不影响在线状态
                item.classList.remove('testing');
                item.classList.add('online');
                badge.className = 'status-badge online';
                badge.textContent = '✓ 在线';
                hint.textContent = '测速失败，点击进入';
                speedEl.textContent = '测速失败';
                tunnel.speed = 0;
                
                return 0;
            }
        }
        
        // 运行全部测速并排序
        async function runSpeedTest() {
            if (isSpeedTesting) return;
            
            const btn = document.querySelector('.speedtest-btn');
            isSpeedTesting = true;
            btn.classList.add('testing');
            btn.querySelector('span').textContent = '测速中...';
            
            // 先确保所有线路都检测过
            const onlineTunnels = tunnels.filter(t => t.status === 'online');
            
            // 对每条在线的线路进行测速
            for (let i = 0; i < tunnels.length; i++) {
                if (tunnels[i].status === 'online') {
                    await testTunnelSpeed(i);
                }
            }
            
            // 按速度排序
            sortTunnelsBySpeed();
            
            isSpeedTesting = false;
            btn.classList.remove('testing');
            btn.querySelector('span').textContent = '测速排序';
        }
        
        // 按速度排序隧道
        function sortTunnelsBySpeed() {
            // 分离在线和离线的
            const onlineTunnels = tunnels.filter(t => t.status === 'online' && t.speed !== null && t.speed > 0);
            const otherTunnels = tunnels.filter(t => !(t.status === 'online' && t.speed !== null && t.speed > 0));
            
            // 在线的按速度从快到慢排序
            onlineTunnels.sort((a, b) => (b.speed || 0) - (a.speed || 0));
            
            // 重新命名
            onlineTunnels.forEach((tunnel, index) => {
                tunnel.name = `线路${index + 1}`;
            });
            
            otherTunnels.forEach((tunnel, index) => {
                tunnel.name = `线路${onlineTunnels.length + index + 1}`;
            });
            
            // 合并
            tunnels = [...onlineTunnels, ...otherTunnels];
            
            // 重新渲染
            renderTunnels();
            
            // 恢复状态显示
            tunnels.forEach((tunnel, index) => {
                const item = document.getElementById('tunnel-' + index);
                if (!item) return;
                
                const badge = item.querySelector('.status-badge');
                const speedEl = item.querySelector('.tunnel-speed');
                const hint = item.querySelector('.tunnel-hint');
                const barFill = item.querySelector('.speed-bar-fill');
                
                if (tunnel.status === 'online') {
                    item.className = 'tunnel-item online';
                    badge.className = 'status-badge online';
                    badge.textContent = '✓ 在线';
                    hint.textContent = '点击进入云盘';
                    item.onclick = () => window.open(tunnel.url, '_blank');
                    
                    if (tunnel.speed && tunnel.speed > 0) {
                        speedEl.textContent = formatSpeed(tunnel.speed);
                        const maxSpeed = 200;
                        const percent = Math.min((tunnel.speed / maxSpeed) * 100, 100);
                        barFill.style.width = percent + '%';
                    }
                } else {
                    item.className = 'tunnel-item offline';
                    badge.className = 'status-badge offline';
                    badge.textContent = '✗ 离线';
                    hint.textContent = '线路已失效';
                    item.onclick = null;
                }
            });
            
            // 标记最快的线路
            if (onlineTunnels.length > 0) {
                const firstItem = document.getElementById('tunnel-0');
                if (firstItem) {
                    firstItem.classList.add('best');
                }
            }
        }
        
        // 页面加载时自动加载
        window.addEventListener('load', () => {
            loadTunnels();
            
            // 已移除自动刷新，改为手动刷新
        });
    </script>
</body>
</html>
